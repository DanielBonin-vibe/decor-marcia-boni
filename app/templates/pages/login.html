<body>

        <h1>Decor Márcia Boni</h1>

                <label for="email" class="form-label">E-mail:</label>

            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha:</label>
                <input type="password"m id="senha", name="senha", class="form-control" required>

                Entrar
            </button>
        </form>

    </div>
</body>
