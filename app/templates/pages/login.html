<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login - Decor Márcia Boni</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="card shadow rounded p-4" style="width: 100%; max-width: 400px;">

            <h1>Decor Márcia Boni</h1>
            <p>Sistema de gestão de eventos</p>

            <form action="/login/" method="post">

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="email" id="email" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha:</label>
                    <input type="password" id="senha" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Entrar
                </button>

            </form>

        </div>

    </div>
</body>
</html>
